# Fly.io deploy config for the Sudoku digit-recognition inference API.
# Lives beside Dockerfile so `fly deploy` run from inside api/ needs no
# extra flags — Fly uses this directory as both config root and build context.

app = "sudoku-solver-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
